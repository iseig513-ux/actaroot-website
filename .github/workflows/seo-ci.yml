name: ActaRoot, Min Sihu and Min Ventures SEO validation
on:
  push:
    branches: ["main", "feat/min-ventures-oh-tienda-20261116"]
  pull_request:
    paths:
      - "content/**"
      - "scripts/**"
      - "sites/**"
      - "workers/**"
      - "tests/**"
      - ".github/workflows/seo-ci.yml"
      - "package.json"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run check
      - name: Confirm generated static outputs are committed and deterministic
        run: git diff --exit-code -- sites
